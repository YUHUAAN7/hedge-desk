function parseCsv(text){var rows=[],row=[],cell='',q=false,i=0;text=text.replace(/^﻿/,'');while(i<text.length){var c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i+=2;continue}q=false;i++;continue}cell+=c;i++;continue}if(c==='"'){q=true;i++;continue}if(c===','){row.push(cell);cell='';i++;continue}if(c==='\r'){i++;continue}if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';i++;continue}cell+=c;i++}if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.filter(function(r){return r.some(function(x){return x!==''})})}
